name: Verify Legacy SAP PR 280

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: 44c512366fbf6ea09884f5220cec8e52f552d310
          fetch-depth: 0
      - name: Assert exact head and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "44c512366fbf6ea09884f5220cec8e52f552d310"
          git diff --name-only d653360602a273988168737edba43440a62247af 44c512366fbf6ea09884f5220cec8e52f552d310 | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/legacy-sap-authoritative-security.yml
          convex/supabaseGateway.ts
          scripts/legacy-sap-authoritative-security-check.mjs
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify legacy SAP authoritative boundary
        run: node scripts/legacy-sap-authoritative-security-check.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Secret scan
        run: node scripts/check-secrets.mjs
