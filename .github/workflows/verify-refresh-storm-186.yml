name: Verify Refresh Storm #186

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "scripts/refresh-coordinator-check.mjs"
      - "src/hooks/useConvexData.tsx"
      - "src/lib/refreshCoordinator.d.mts"
      - "src/lib/refreshCoordinator.mjs"
      - "scripts/verify-refresh-storm-186.py"
      - ".github/workflows/verify-refresh-storm-186.yml"

permissions:
  contents: read

jobs:
  verify-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact PR 186 target invariants
        run: python3 scripts/verify-refresh-storm-186.py
      - name: Run deterministic 30-user refresh-storm gate
        run: node scripts/refresh-coordinator-check.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/check-secrets.mjs
