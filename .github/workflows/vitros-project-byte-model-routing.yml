name: VITROS PROJECT_BYTE model routing patch

on:
  push:
    branches: [fix/project-byte-model-routing]
    paths:
      - '.github/workflows/vitros-project-byte-model-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-byte-model-routing
          fetch-depth: 0

      - name: Patch bridge model routing
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('bridge/runner.py')
          s=p.read_text()

          anchor='DEFAULT_REPO = "jmw7629/vitros-web-dashboard"\n'
          insert='''DEFAULT_REPO = "jmw7629/vitros-web-dashboard"\nMODEL_HINT_LINE_RE = re.compile(r"(?m)^PROJECT_BYTE_MODEL_HINT:[ \\t]*([^\\r\\n]+?)[ \\t]*$")\nMODEL_HINT_VALUE_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,63}/[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$")\n'''
          if 'MODEL_HINT_LINE_RE' not in s:
              if anchor not in s: raise SystemExit('default repo anchor missing')
              s=s.replace(anchor,insert,1)

          anchor='def trusted_authors()->set[str]: return {x.strip() for x in os.getenv("BRIDGE_TRUSTED_AUTHORS","jmw7629").split(",") if x.strip()}\n'
          helpers='''def trusted_authors()->set[str]: return {x.strip() for x in os.getenv("BRIDGE_TRUSTED_AUTHORS","jmw7629").split(",") if x.strip()}\ndef project_byte_model_hint(body:str)->str:\n    m=MODEL_HINT_LINE_RE.search(body or "")\n    if not m:return ""\n    v=m.group(1).strip()\n    return v if MODEL_HINT_VALUE_RE.fullmatch(v) else ""\ndef choose_model(body:str,env_model:str)->tuple[str,str]:\n    hinted=project_byte_model_hint(body)\n    if hinted:return hinted,"project-byte"\n    fallback=(env_model or "").strip()\n    return fallback,("environment" if fallback else "default")\n'''
          if 'def project_byte_model_hint' not in s:
              if anchor not in s: raise SystemExit('trusted authors anchor missing')
              s=s.replace(anchor,helpers,1)

          old='''    cmd=[os.getenv("OPENCODE_BIN","opencode"),"run","--dir",str(wt),"--auto","--format","json","--title",f"VITROS issue #{n}"]\n    if os.getenv("OPENCODE_MODEL","").strip(): cmd += ["--model",os.getenv("OPENCODE_MODEL","").strip()]\n'''
          new='''    cmd=[os.getenv("OPENCODE_BIN","opencode"),"run","--dir",str(wt),"--auto","--format","json","--title",f"VITROS issue #{n}"]\n    model,model_source=choose_model(i.get("body") or "",os.getenv("OPENCODE_MODEL",""))\n    if model: cmd += ["--model",model]\n'''
          if old in s:s=s.replace(old,new,1)
          elif 'model,model_source=choose_model' not in s:raise SystemExit('model command anchor missing')

          old='''    p=run(cmd,cwd=wt,check=False,env=env); log.write_text(f"$ {shlex.join(cmd[:-1])} <PROMPT>\\n\\nexit={p.returncode}\\n\\nSTDOUT\\n{p.stdout or ''}\\n\\nSTDERR\\n{p.stderr or ''}\\n"); os.chmod(log,0o600)\n'''
          new='''    p=run(cmd,cwd=wt,check=False,env=env); log.write_text(f"Model source: {model_source}\\nModel: {model or '(OpenCode default)'}\\n$ {shlex.join(cmd[:-1])} <PROMPT>\\n\\nexit={p.returncode}\\n\\nSTDOUT\\n{p.stdout or ''}\\n\\nSTDERR\\n{p.stderr or ''}\\n"); os.chmod(log,0o600)\n'''
          if old in s:s=s.replace(old,new,1)
          elif 'Model source: {model_source}' not in s:raise SystemExit('log anchor missing')

          old='''    body=f"Generated by the VITROS ChatGPT ↔ OpenCode bridge for issue #{n}.\\n\\nCloses #{n}\\n\\n### Bridge verification\\n- `git diff --check`: PASS\\n- OpenCode log retained locally\\n- Auto-merge: DISABLED\\n\\n### Changed files\\n```\\n{stat}\\n```\\n"\n'''
          new='''    body=f"Generated by the VITROS ChatGPT ↔ OpenCode bridge for issue #{n}.\\n\\nCloses #{n}\\n\\n### Bridge verification\\n- `git diff --check`: PASS\\n- Model source: `{model_source}`\\n- Model: `{model or 'OpenCode default'}`\\n- OpenCode log retained locally\\n- Auto-merge: DISABLED\\n\\n### Changed files\\n```\\n{stat}\\n```\\n"\n'''
          if old in s:s=s.replace(old,new,1)
          elif 'Model source: `{model_source}`' not in s:raise SystemExit('PR body anchor missing')

          marker='def main()->int:\n'
          selftest='''def self_test()->int:\n    cases=[\n        ("PROJECT_BYTE_MODEL_HINT: openai/gpt-5.6-sol","openai/gpt-5.6-sol"),\n        ("PROJECT_BYTE_MODEL_HINT: ollama/qwen3-coder:30b","ollama/qwen3-coder:30b"),\n        ("PROJECT_BYTE_MODEL_HINT: openai/gpt; rm -rf /",""),\n        ("PROJECT_BYTE_MODEL_HINT: https://example.com/model",""),\n        ("PROJECT_BYTE_MODEL_HINT: openai/gpt 5",""),\n        ("PROJECT_BYTE_MODEL_HINT: openai/gpt$(touch /tmp/pwned)",""),\n    ]\n    for body,expected in cases:\n        got=project_byte_model_hint(body)\n        if got!=expected:\n            print(f"bridge self-test: model hint FAILED: {body!r} -> {got!r}",file=sys.stderr);return 1\n    if choose_model("PROJECT_BYTE_MODEL_HINT: openai/gpt-5.6-sol","env/model")!=("openai/gpt-5.6-sol","project-byte"):\n        print("bridge self-test: hint precedence FAILED",file=sys.stderr);return 1\n    if choose_model("PROJECT_BYTE_MODEL_HINT: openai/gpt;bad","env/model")!=("env/model","environment"):\n        print("bridge self-test: invalid hint fallback FAILED",file=sys.stderr);return 1\n    if choose_model("","")!=("","default"):\n        print("bridge self-test: default routing FAILED",file=sys.stderr);return 1\n    print("bridge self-test: PASS");return 0\n\n'''
          if 'def self_test()->int:' not in s:
              if marker not in s:raise SystemExit('main anchor missing')
              s=s.replace(marker,selftest+marker,1)

          old='''    ap=argparse.ArgumentParser(); ap.add_argument("--repo",default=os.getenv("BRIDGE_REPO",DEFAULT_REPO)); ap.add_argument("--root",default=os.getenv("BRIDGE_ROOT","")); ap.add_argument("--interval",type=int,default=int(os.getenv("BRIDGE_POLL_SECONDS","60"))); ap.add_argument("--once",action="store_true"); a=ap.parse_args()\n'''
          new='''    ap=argparse.ArgumentParser(); ap.add_argument("--repo",default=os.getenv("BRIDGE_REPO",DEFAULT_REPO)); ap.add_argument("--root",default=os.getenv("BRIDGE_ROOT","")); ap.add_argument("--interval",type=int,default=int(os.getenv("BRIDGE_POLL_SECONDS","60"))); ap.add_argument("--once",action="store_true"); ap.add_argument("--self-test",action="store_true"); a=ap.parse_args()\n    if a.self_test:return self_test()\n'''
          if old in s:s=s.replace(old,new,1)
          elif 'a.self_test:return self_test()' not in s:raise SystemExit('argparse anchor missing')

          p.write_text(s)
          PY
          python3 -m py_compile bridge/runner.py
          python3 bridge/runner.py --self-test
          git diff --check
          ! grep -n 'shell=True' bridge/runner.py
          grep -q 'PROJECT_BYTE_MODEL_HINT' bridge/runner.py
          grep -q 'model_source' bridge/runner.py

      - name: Commit bridge-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bridge/runner.py
          git commit -m 'Bridge: honor safe PROJECT_BYTE model hints'
          git push origin HEAD:fix/project-byte-model-routing
