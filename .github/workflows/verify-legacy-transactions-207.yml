name: Verify Legacy Transactions PR 207

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: 15f2deb13ffc8459af0658c1819eb12f3479e2e3
          fetch-depth: 0
      - name: Assert exact head and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "15f2deb13ffc8459af0658c1819eb12f3479e2e3"
          git diff --name-only 152e61073f2a35e2a701fadb8ccd42006ecc43ed 15f2deb13ffc8459af0658c1819eb12f3479e2e3 | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/legacy-transactions-security.yml
          convex/transactions.ts
          scripts/legacy-transactions-security-check.mjs
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify legacy transaction containment
        run: node scripts/legacy-transactions-security-check.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Secret scan
        run: node scripts/check-secrets.mjs
