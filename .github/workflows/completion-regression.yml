name: Completion Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  behavioral-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: vitros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Employee access lifecycle behavior
        run: node scripts/employee-access-check.mjs
      - name: Employee action boundary behavior
        run: node scripts/employee-boundary-check.mjs
      - name: REM parser behavior
        run: node scripts/rem-workbook-parser-acceptance.mjs
      - name: REM operational parser behavior
        run: node scripts/rem-operational-parser-acceptance.mjs
      - name: REM resumable upload behavior
        run: node scripts/rem-operational-upload-acceptance.mjs
      - name: REM operational server validation and authorization
        run: node scripts/rem-operational-validation-check.mjs
      - name: REM operational browser component behavior
        run: node scripts/rem-operational-ui-behavior.mjs
      - name: Digital DHR contract and authenticated action behavior
        run: node scripts/dhr-document-action-check.mjs
      - name: Digital DHR durable queue and conflict recovery behavior
        run: node scripts/dhr-document-client-check.mjs
      - name: Install Chromium for native IndexedDB verification
        run: npx playwright install --with-deps chromium --only-shell
      - name: Digital DHR native browser reload and lost-response recovery
        env:
          DHR_BROWSER_ARTIFACT_DIR: .verification/dhr-browser
        run: node scripts/dhr-document-browser-check.mjs
      - name: Native dashboard desktop and mobile component verification
        env:
          DASHBOARD_BROWSER_ARTIFACT_DIR: .verification/dashboard-browser
        run: node scripts/dashboard-browser-acceptance.mjs
      - name: Upload synthetic dashboard browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser
          path: .verification/dashboard-browser
          if-no-files-found: ignore
      - name: Upload synthetic DHR browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-dhr-browser
          path: .verification/dhr-browser
          if-no-files-found: ignore
      - name: Employee canonical login behavior
        run: node scripts/employee-login-check.mjs
      - name: Role login UI and server access behavior
        run: |
          node scripts/role-login-behavior-check.mjs
          node scripts/role-access-behavior-check.mjs
          node scripts/data-auth-readiness-check.mjs
          node scripts/dhr-delete-action-check.mjs
          node scripts/dhr-delete-ui-check.mjs
          node scripts/runtime-env-sync-behavior.mjs
      - name: Zen AI administration and provider boundaries
        run: node scripts/zen-ai-admin-behavior-check.mjs
      - name: Cycle Count durable session and UI behavior
        run: |
          node scripts/cycle-count-behavior-check.mjs
          node scripts/cycle-count-action-check.mjs
      - name: Zen AI administration desktop and mobile browser behavior
        run: node scripts/zen-ai-admin-browser-check.mjs
      - name: Cycle Count desktop and mobile browser behavior
        run: node scripts/cycle-count-browser-check.mjs
      - name: Stock Summary header and row column geometry
        run: node scripts/stock-column-browser-check.mjs
      - name: Settings responsive layout and Engineer customization
        run: node scripts/settings-browser-check.mjs
      - name: Config editor actual component behavior
        run: node scripts/config-editor-behavior-check.mjs
      - name: Customization server handlers and dashboard reporting
        env:
          TZ: America/New_York
        run: |
          node scripts/customization-handler-test.mjs
          node scripts/period-helper-test.mjs
          node scripts/inventory-period-action-test.mjs
          node scripts/dashboard-role-routing-test.mjs
          node scripts/rem-period-report-test.mjs
          node scripts/dashboard-component-acceptance.mjs
      - name: Employee retry identity behavior
        run: node scripts/employee-operation-identity-check.mjs
      - name: Employee account identity behavior
        run: node scripts/employee-identity-check.mjs
      - name: User dashboard identity behavior
        run: node scripts/user-dashboard-identity-check.mjs
      - name: Scanner operator identity behavior
        run: node scripts/scan-kiosk-identity-check.mjs
      - name: Receipt identity behavior
        run: node scripts/incoming-stock-identity-unit.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Disposable employee transaction verification
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: disposable_test_only
          PGDATABASE: vitros_test
        run: |
          psql -v ON_ERROR_STOP=1 -f database/tests/employee_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/20260912213423_employee_login_canonical_resolver.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/employee_login.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/20260910_canonical_employee_directory.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/employee_transition.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/20260912214448_employee_transition_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/employee_reconciliation.sql

  rem-operational-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: rem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Disposable REM staging, atomic import, and replay verification
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: disposable_test_only
          PGDATABASE: rem_test
        run: |
          psql -v ON_ERROR_STOP=1 -f database/tests/rem_operational_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260905074500_rem_authoritative_workbook_parity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260913123239_rem_operational_staged_import.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/rem_operational_import.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/rem_progress_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907033000_rem_operational_analyzer_updates.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260917185334_rem_stage_progress.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260917195154_rem_progress_service_permissions.sql
          psql -v ON_ERROR_STOP=1 -c 'BEGIN' -f scripts/rem-progress-db-test.sql -c 'ROLLBACK'


  dhr-document-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: dhr_document_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dhr_document_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Disposable DHR field events through existing atomic inventory and scanner
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: disposable_test_only
          PGDATABASE: dhr_document_test
        run: |
          psql -v ON_ERROR_STOP=1 -f database/tests/dhr_document_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/20260830_vitros_atomic_inventory_transition.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/20260909_extend_inventory_operations_with_material_request.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/20260903_dhr_atomic_scan_transition.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260906131500_dhr_controlled_inventory_alias.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260905191500_dhr_legacy_baseline_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260913133922_dhr_document_field_bridge.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/dhr_document_bridge.sql

          # The synthetic bootstrap omits the legacy completed_at field.
          psql -v ON_ERROR_STOP=1 -c 'alter table public.dhr_scan_sessions add column completed_at timestamptz'
          psql -v ON_ERROR_STOP=1 -f database/migrations/20260904_dhr_session_lifecycle_revisions.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/20260906_dhr_session_event_trigger_least_privilege.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260915145102_delete_active_dhr.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/dhr_delete.sql

      - name: Cycle Count durable sessions and atomic inventory adjustments
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: disposable_test_only
          PGDATABASE: dhr_document_test
        run: |
          psql -v ON_ERROR_STOP=1 -c "alter table public.stock add column if not exists type text default 'Required'; alter table public.stock add column if not exists min_qty integer default 1; alter table public.stock add column if not exists max_qty integer default 10; alter table public.stock add column if not exists on_plan boolean default false;"
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260915160246_cycle_count_sessions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923002237_cycle_count_dhr_lock_order.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/cycle_count_sessions.sql

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Concurrent Cycle Count and DHR lifecycle transactions
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: disposable_test_only
          PGDATABASE: dhr_document_test
          VITROS_DISPOSABLE_DATABASE: "1"
        run: |
          npm install --prefix "$RUNNER_TEMP/cycle-count-client" --no-save --ignore-scripts pg@8.16.3
          NODE_PATH="$RUNNER_TEMP/cycle-count-client/node_modules" node scripts/cycle-count-concurrency-check.cjs
