name: Verify REM Workbook #148

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-rem-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact implementation SHA
        run: node scripts/verify-rem-workbook-148.mjs
