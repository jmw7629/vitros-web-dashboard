name: Verify DHR Scanner Atomic 175

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch exact implementation head read-only
        env:
          TARGET_SHA: 3b253690f68740f04f3e661a2b392dad608bd94f
        run: git fetch --no-tags --depth=1 origin "$TARGET_SHA"
      - name: Verify exact implementation head
        run: node scripts/verify-dhr-scanner-atomic-175.mjs
