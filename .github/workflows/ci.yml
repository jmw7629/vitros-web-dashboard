name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Secret pattern check
        run: node scripts/check-secrets.mjs
      - name: Browser safe-read boundary check
        run: node scripts/browser-safe-read-security-check.mjs
      - name: Browser safe-read staging runtime smoke
        run: node scripts/browser-safe-read-staging-smoke.mjs
      - name: Lint
        run: npm run lint || true
      - name: Git diff check
        run: git diff --check
