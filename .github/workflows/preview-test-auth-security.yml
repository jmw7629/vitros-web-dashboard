name: Preview Test Auth Security

on:
  pull_request:
    paths:
      - "convex/auth.ts"
      - "convex/testAuth.ts"
      - "convex/seedTestUser.ts"
      - "scripts/preview-test-auth-security-check.mjs"
      - ".github/workflows/preview-test-auth-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-test-auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify preview test-auth boundaries
        run: node scripts/preview-test-auth-security-check.mjs
