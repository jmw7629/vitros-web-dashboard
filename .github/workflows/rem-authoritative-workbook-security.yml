name: REM Authoritative Workbook Security

on:
  pull_request:
    paths:
      - "src/lib/remWorkbookAuthoritative.ts"
      - "src/pages/rem/BulkImport.tsx"
      - "convex/remWorkbookActions.ts"
      - "supabase/migrations/20260905074500_rem_authoritative_workbook_parity.sql"
      - "scripts/rem-authoritative-workbook-security-check.mjs"
      - ".github/workflows/rem-authoritative-workbook-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify authoritative REM workbook boundaries
        run: node scripts/rem-authoritative-workbook-security-check.mjs
