name: Viktor Tools Security

on:
  pull_request:
    paths:
      - "convex/viktorTools.ts"
      - "scripts/viktor-tools-security-check.mjs"
      - ".github/workflows/viktor-tools-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify secret-backed Viktor tool containment
        run: node scripts/viktor-tools-security-check.mjs
