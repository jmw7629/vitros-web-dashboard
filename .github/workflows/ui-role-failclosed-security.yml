name: UI Role Fail-Closed Security

on:
  pull_request:
    paths:
      - "src/hooks/useRole.tsx"
      - "scripts/ui-role-failclosed-security-check.mjs"
      - ".github/workflows/ui-role-failclosed-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify UI role fail-closed behavior
        run: node scripts/ui-role-failclosed-security-check.mjs
