name: Legacy SAP Authoritative Security

on:
  pull_request:
    paths:
      - "convex/inventoryActions.ts"
      - "scripts/legacy-sap-authoritative-security-check.mjs"
      - ".github/workflows/legacy-sap-authoritative-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/legacy-sap-authoritative-security-check.mjs
      - run: npm run typecheck
      - run: npm run build
