name: Verify DHR Auth Action #152

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-dhr-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact implementation SHA
        run: node scripts/verify-dhr-auth-action-152.mjs
