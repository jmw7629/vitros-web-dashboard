name: Verify SAP Staging #179

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-sap-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact implementation SHA
        run: node scripts/verify-sap-staging-179.mjs
