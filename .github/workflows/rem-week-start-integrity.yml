name: REM Week Start Integrity

on:
  pull_request:
    paths:
      - "supabase/migrations/20260906020000_rem_week_start_iso_integrity.sql"
      - "scripts/rem-week-start-integrity-check.mjs"
      - ".github/workflows/rem-week-start-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify REM ISO week-start guard
        run: node scripts/rem-week-start-integrity-check.mjs
