name: Legacy Parts Security

on:
  pull_request:
    paths:
      - "convex/parts.ts"
      - "scripts/legacy-parts-security-check.mjs"
      - ".github/workflows/legacy-parts-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify legacy parts authorization boundaries
        run: node scripts/legacy-parts-security-check.mjs
