name: Viktor Email Error Security

on:
  pull_request:
    paths:
      - "convex/ViktorSpacesEmail.ts"
      - "scripts/viktor-email-error-security-check.mjs"
      - ".github/workflows/viktor-email-error-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify provider error containment
        run: node scripts/viktor-email-error-security-check.mjs
