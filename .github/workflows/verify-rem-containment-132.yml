name: Verify REM Containment #132

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-rem-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact target SHA invariants
        run: node scripts/verify-rem-containment-132.mjs
