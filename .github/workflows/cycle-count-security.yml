name: Cycle Count Security

on:
  pull_request:
    paths:
      - "convex/cycleCount.ts"
      - "scripts/cycle-count-security-check.mjs"
      - ".github/workflows/cycle-count-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cycle Count authorization and integrity boundaries
        run: node scripts/cycle-count-security-check.mjs
